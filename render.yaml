services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: pnl-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT automatically — must bind to 0.0.0.0
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false          # set this manually in the Render dashboard
      # Pinned, not sync:false. These were dashboard-managed, so a code
      # change that moved the source left the deployment pointing at the old
      # dataset with the new default table -- a combination that has never
      # existed. Declaring them here keeps deploys reproducible.
      - key: BQ_PROJECT
        value: nodal-plexus-492111-e9
      - key: BQ_DATASET
        value: lyson_sons
      - key: BQ_GL_TABLE
        value: Conso_GL_Dump_latest
      - key: FRONTEND_ORIGIN
        sync: false          # e.g. https://your-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: pnl-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false          # e.g. https://pnl-backend.onrender.com
      - key: NODE_VERSION
        value: "20"
